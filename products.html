<body>

<div class="top-header-section"></div>

<!-- ========== PRODUCTS HERO ========== -->
<section class="products-hero" style="background-image: url('assets/images.png/Newplant3.png'); background-size: cover; background-position: center; min-height: 285px;">
    <div class="products-hero-overlay"></div>
    <div class="container">
        <div class="products-hero-content" data-aos="fade-up">
            <span class="hero-badge">OUR PREMIUM COLLECTION</span>
            <h1>Dairy Equipment & Milking Machines</h1>
            <p>Discover our wide range of high-quality dairy equipment designed for performance and longevity</p>
            <div class="hero-buttons">
                <a href="#products" class="btn-primary-custom">Shop Products &rarr;</a>
                <a href="contact.html" class="btn-outline-custom">Get a Quote</a>
            </div>
        </div>
    </div>
</section>

<!-- ========== PRODUCTS CATALOG SECTION ========== -->
<section class="products-catalog-section py-5" id="products" style="background: #f8fafc;">
    <div class="container-fluid container-xxl px-3 px-md-4">
        
        <!-- Search Bar Section -->
        <div class="search-wrapper mb-4" data-aos="fade-up">
            <div class="search-box mx-auto" style="max-width: 680px; position: relative;">
                <i class="fas fa-search search-icon" style="position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: #2563eb; font-size: 1.1rem;"></i>
                <input type="text" id="productSearchInput" class="form-control rounded-pill ps-5 pe-5 py-3 shadow-sm border-2" style="border-color: #2563eb !important; font-weight: 500;" placeholder="Search for machines (e.g. Milking machine, Khoya, Paneer...)" autocomplete="off">
                <button id="clearSearch" class="btn text-secondary border-0 p-0" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); display: none; background: none;"><i class="fas fa-times"></i></button>
            </div>
        </div>

        <!-- Mobile Category Title Text (Phone View Only) -->
        <div class="mobile-slider-title d-md-none mb-2 fw-extrabold text-uppercase px-1" style="color: #1e3a8a; font-size: 0.82rem; letter-spacing: 1px;">
            <i class="fas fa-filter text-primary me-2"></i> ALL CATEGORIES LIST
        </div>

        <!-- Mobile Category Auto-Scroll Slider (Phone View Only) -->
        <div class="mobile-category-slider-container d-md-none mb-3 overflow-hidden position-relative" data-aos="fade-up">
            <div class="mobile-slider-track" id="mobileSliderTrack">
                <div class="mobile-slider-content" id="mobileMarqueeContent" style="display: inline-flex; gap: 10px;">
                    <!-- Dynamically populated via product.js -->
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- LEFT SIDEBAR: PRODUCT CATEGORIES -->
            <div class="col-lg-3 col-md-4">
                <!-- Sidebar Card -->
                <div class="category-sidebar-card collapse d-md-block" id="mobileCategorySidebar" data-aos="fade-up">
                    <div class="sidebar-header d-flex align-items-center gap-2 mb-3 pb-2 border-bottom">
                        <i class="fas fa-filter text-primary" style="font-size: 1rem; color: #2563eb !important;"></i>
                        <h6 class="sidebar-title m-0 fw-extrabold" style="color: #475569; letter-spacing: 1.2px; font-size: 0.82rem;">PRODUCT CATEGORIES</h6>
                    </div>
                    
                    <div class="category-sidebar-list" id="categorySidebarList">
                        <!-- Dynamically populated via product.js -->
                    </div>
                </div>
            </div>

            <!-- RIGHT MAIN AREA: CATALOG HEADER + PRODUCT GRID -->
            <div class="col-lg-9 col-md-8">
                <!-- Catalog Header Bar -->
                <div class="catalog-header-bar d-flex flex-wrap align-items-center justify-content-between mb-4 p-3 px-4 bg-white rounded-4 shadow-sm border" data-aos="fade-up">
                    <div>
                        <span class="catalog-sublabel text-uppercase text-muted fw-bold" style="font-size: 0.72rem; letter-spacing: 1px;">CATALOG VIEW</span>
                        <h2 class="catalog-main-title m-0 fw-extrabold" id="activeCategoryTitle" style="color: #0d3b66; font-size: 1.45rem;">All Products</h2>
                    </div>
                    <div class="product-count-badge text-muted fw-semibold" style="font-size: 0.88rem;" id="productCountBadge">
                        Showing <span id="visibleProductCount" class="fw-bold text-primary">0</span> Products
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-xl-3" id="productsGrid">
                    <!-- Dynamically populated via product.js -->
                </div>
            </div>
        </div>
    </div>
</section>
